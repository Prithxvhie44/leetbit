<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leetbit Helper</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        min-width: 320px;
        margin: 0;
        padding: 16px;
        background: #0f172a;
        color: #e2e8f0;
      }
      label, button, input { display: block; width: 100%; }
      input, button {
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #334155;
        box-sizing: border-box;
      }
      button {
        background: #38bdf8;
        color: #0f172a;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: #1e293b;
        color: #e2e8f0;
      }
      .row { margin-bottom: 12px; }
      .status { margin-top: 12px; font-size: 13px; color: #94a3b8; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="row">
      <label for="backendUrl">Backend URL</label>
      <input id="backendUrl" placeholder="http://localhost:8000" />
    </div>
    <div class="row">
      <label for="leetcodeUsername">LeetCode username</label>
      <input id="leetcodeUsername" placeholder="your-username" />
    </div>
    <div class="row">
      <button id="save">Save settings</button>
    </div>
    <div class="row">
      <button id="capture">Capture LeetCode session</button>
    </div>
    <div class="row">
      <button id="connectGithub" class="secondary">Connect GitHub</button>
    </div>
    <div class="status" id="status">Ready.</div>
    <script src="popup.js"></script>
  </body>
</html>
